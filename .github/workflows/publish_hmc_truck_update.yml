name: Publish HMC Truck in-app update

on:
  push:
    branches: [main]
    paths: [hmc-truck/PUBLISH_TRIGGER.json]

permissions:
  contents: write

concurrency:
  group: hmc-truck-update-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate exact source, signer and previous manifest
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          from urllib.parse import urlsplit
          data=json.loads(Path("hmc-truck/PUBLISH_TRIGGER.json").read_text())
          required=["artifactUrl","sha256","versionName","versionCode","sourceCommit",
                    "expectedSignerCertificateSha256","previousVersionCode","previousSha256"]
          assert all(data.get(k) for k in required), "Incomplete publish trigger"
          url=urlsplit(data["artifactUrl"])
          assert url.scheme=="https" and not url.username and not url.password and not url.fragment
          assert url.hostname and url.hostname.endswith(".oaiusercontent.com"), "Unapproved artifact transfer host"
          assert not any(c in data["artifactUrl"] for c in "\r\n"), "Invalid artifact URL"
          for k in ["sha256","previousSha256","expectedSignerCertificateSha256"]:
              assert re.fullmatch(r"[0-9a-fA-F]{64}",data[k]), "Invalid digest"
          assert re.fullmatch(r"[0-9a-f]{40}",data["sourceCommit"]), "Invalid source SHA"
          assert data["expectedSignerCertificateSha256"].lower()=="8a3441a39d2ca66e0c65bd31bcef6f61f2d84730277fa6abd43990f26babafe8", "Unapproved application signer"
          manifest=json.loads(Path("hmc-truck/manifest.json").read_text())
          assert manifest["versionCode"]==data["previousVersionCode"], "Previous version changed"
          assert manifest["sha256"].lower()==data["previousSha256"].lower(), "Previous APK changed"
          assert isinstance(data["versionCode"],int) and data["versionCode"]>manifest["versionCode"], "Rollback or same-version publication"
          assert data["versionName"]=="3.4.1", "Unexpected version name"
          outputs={"url":data["artifactUrl"],"sha":data["sha256"].lower(),
                   "version_name":data["versionName"],"version_code":data["versionCode"],
                   "source_commit":data["sourceCommit"],"signer":data["expectedSignerCertificateSha256"].lower(),
                   "previous_version_code":data["previousVersionCode"],"previous_sha":data["previousSha256"].lower()}
          for key,value in outputs.items(): print(str(key)+"="+str(value))
          Path("/tmp/hmc-publish-trigger.json").write_text(json.dumps(data,sort_keys=True))
          PY

      - name: Download and verify APK, provenance, package and signature
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.trigger.outputs.url }}
          EXPECTED_SHA: ${{ steps.trigger.outputs.sha }}
          EXPECTED_SOURCE: ${{ steps.trigger.outputs.source_commit }}
          EXPECTED_SIGNER: ${{ steps.trigger.outputs.signer }}
          VERSION_CODE: ${{ steps.trigger.outputs.version_code }}
          VERSION_NAME: ${{ steps.trigger.outputs.version_name }}
        run: |
          set -euo pipefail
          curl --fail --location --proto "=https" --proto-redir "=https" --retry 2 "$ARTIFACT_URL" -o /tmp/hmc-artifact.zip
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,zipfile
          from pathlib import Path
          with zipfile.ZipFile("/tmp/hmc-artifact.zip") as archive:
              apks=[n for n in archive.namelist() if n.endswith(".apk")]
              legacy_records=[n for n in archive.namelist() if n.endswith("V03.04.1_FIELD_TEST_PROVENANCE.json")]
              r2_records=[n for n in archive.namelist() if n.endswith("HMC_3.4.1_322_R2_PROVENANCE.json")]
              r3_records=[n for n in archive.namelist() if n.endswith("HMC_3.4.1_323_R3_PROVENANCE.json")]
              r4_records=[n for n in archive.namelist() if n.endswith("HMC_3.4.1_324_R4_PROVENANCE.json")]
              r5_records=[n for n in archive.namelist() if n.endswith("HMC_3.4.1_325_R5_PROVENANCE.json")]
              r6_records=[n for n in archive.namelist() if n.endswith("HMC_3.4.1_326_R6_PROVENANCE.json")]
              records=legacy_records+r2_records+r3_records+r4_records+r5_records+r6_records
              candidates=[n for n in archive.namelist() if n.endswith("BUILD_INFO.txt")]
              assert len(apks)==1, "Ambiguous release APK"
              if len(records)==1 and not candidates:
                  provenance=json.loads(archive.read(records[0]))
                  if r2_records or r3_records or r4_records or r5_records or r6_records:
                      # R2, R3 and the owner-approved R4 must each be signed,
                      # source-bound FIELD DEMO trials, never a FINAL release.
                      assert len(r2_records)+len(r3_records)+len(r4_records)+len(r5_records)+len(r6_records)==1 and not legacy_records, "Ambiguous trial evidence"
                      trial_code=322 if r2_records else (323 if r3_records else (324 if r4_records else (325 if r5_records else 326)))
                      assert int(os.environ["VERSION_CODE"])==trial_code, "Trial version mismatch"
                      assert provenance.get("trialOnly") is True, "Must remain a trial"
                      assert provenance.get("finalRelease") is False, "Trial cannot be FINAL"
                      assert provenance.get("mainMerge")=="FORBIDDEN", "Trial main merge forbidden"
                      assert provenance.get("deviceValidation")=="PENDING", "Device evidence mismatch"
                      assert provenance.get("sharedStateBackend")=="DISABLED_FIELD_DEMO_LOCAL_ONLY", "Shared-state boundary changed"
                      assert provenance.get("target")=="lib/main_stage5_field_demo.dart", "Must be field demo"
                      if r6_records:
                          assert provenance.get("sourceCommit")=="68c00f6a95c170e6bbb8eb51d0d059b0d3849c45", "Unapproved R6 source"
                          assert provenance.get("apkSha256")=="6718928d2bbb993837dc4176e25e95e639a8aa7ab4aea7110470df0cf13c00e8", "Unapproved R6 APK digest"
                          assert provenance.get("runUrl")=="https://github.com/hanakim2001/HMC-Truck-Sequence-Feeding/actions/runs/45535031093", "R6 build run mismatch"
              else:
                  assert len(records)==0 and len(candidates)==1, "Ambiguous APK provenance"
                  lines=archive.read(candidates[0]).decode("utf-8").splitlines()
                  fields=dict(line.split("=",1) for line in lines if "=" in line)
                  assert fields.get("version")=="3.4.1+319", "Incorrect candidate version"
                  assert fields.get("state")=="FIELD_CANDIDATE_NOT_VERIFIED", "Candidate status mismatch"
                  assert fields.get("JIS_WRITE")=="FORBIDDEN", "JIS read-only lock missing"
                  assert fields.get("shared_state_remote")=="DISABLED", "Remote state safety lock missing"
                  assert fields.get("full_regression")=="failure", "Regression evidence must remain explicit"
                  signer_files=[n for n in archive.namelist() if n.endswith("SIGNING_CERTIFICATE.txt")]
                  sha_files=[n for n in archive.namelist() if n.endswith("SHA256.txt")]
                  assert len(signer_files)==len(sha_files)==1, "Missing candidate integrity evidence"
                  cert=archive.read(signer_files[0]).decode("utf-8")
                  assert os.environ["EXPECTED_SIGNER"] in cert, "Candidate signer evidence mismatch"
                  sha_line=archive.read(sha_files[0]).decode("utf-8").split()[0].lower()
                  assert sha_line==os.environ["EXPECTED_SHA"], "Candidate SHA-256 evidence mismatch"
                  provenance={
                      "apkSha256":sha_line,
                      "sourceCommit":fields.get("source"),
                      "versionCode":319,
                      "versionName":"3.4.1",
                      "applicationId":"com.seunghyun.hmc.truck_feeding",
                      "target":"lib/main_stage5_field_demo.dart",
                      "signerCertificateSha256":os.environ["EXPECTED_SIGNER"]
                  }
                  # Code319 is built from operational main_stage5, not the retired demo.
                  assert provenance["sourceCommit"]==os.environ["EXPECTED_SOURCE"], "Unexpected candidate source"
                  provenance["target"]="lib/main_stage5.dart"
              apk_bytes=archive.read(apks[0])
          digest=hashlib.sha256(apk_bytes).hexdigest()
          assert digest==os.environ["EXPECTED_SHA"]==provenance["apkSha256"], "APK digest mismatch"
          assert provenance["sourceCommit"]==os.environ["EXPECTED_SOURCE"], "Source provenance mismatch"
          assert provenance["versionCode"]==int(os.environ["VERSION_CODE"]), "Provenance version mismatch"
          assert provenance["versionName"]==os.environ["VERSION_NAME"], "Provenance name mismatch"
          assert provenance["applicationId"]=="com.seunghyun.hmc.truck_feeding"
          assert provenance["target"] in ("lib/main_stage5_field_demo.dart","lib/main_stage5.dart")
          assert provenance["signerCertificateSha256"].lower()==os.environ["EXPECTED_SIGNER"]
          apk=Path("/tmp/hmc-verified.apk"); apk.write_bytes(apk_bytes)
          sdk=Path(os.environ.get("ANDROID_HOME") or os.environ["ANDROID_SDK_ROOT"])
          tools=[p.parent for p in (sdk/"build-tools").glob("*/aapt") if (p.parent/"apksigner").is_file()]
          assert tools, "Android signature verification tools unavailable"
          tool=sorted(tools,key=lambda p:tuple(map(int,re.findall(r"\d+",p.name))))[-1]
          badging=subprocess.run([str(tool/"aapt"),"dump","badging",str(apk)],check=True,capture_output=True,text=True).stdout
          identity=re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",badging)
          assert identity and identity.groups()==("com.seunghyun.hmc.truck_feeding",os.environ["VERSION_CODE"],os.environ["VERSION_NAME"]), "APK identity mismatch"
          signed=subprocess.run([str(tool/"apksigner"),"verify","--print-certs",str(apk)],check=True,capture_output=True,text=True).stdout
          signer=re.search(r"certificate SHA-256 digest: ([0-9a-fA-F]+)",signed)
          assert signer and signer.group(1).lower()==os.environ["EXPECTED_SIGNER"], "APK signing certificate mismatch"
          print("Verified APK package, version, signature, source and SHA-256")
          PY

      - name: Stage immutable verified APK without changing update manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          trigger=json.loads(Path("/tmp/hmc-publish-trigger.json").read_text())
          assert json.loads(Path("hmc-truck/PUBLISH_TRIGGER.json").read_text())==trigger, "Publish trigger changed concurrently"
          manifest=json.loads(Path("hmc-truck/manifest.json").read_text())
          assert manifest["versionCode"]==trigger["previousVersionCode"], "Published version changed concurrently"
          assert manifest["sha256"].lower()==trigger["previousSha256"].lower(), "Published APK changed concurrently"
          apk=Path("/tmp/hmc-verified.apk").read_bytes()
          assert hashlib.sha256(apk).hexdigest()==trigger["sha256"].lower()
          filename="HMC_Truck_Sequence_Feeding_code"+str(trigger["versionCode"])+"_"+trigger["sha256"][:12].lower()+".apk"
          versioned=Path("hmc-truck")/filename
          if versioned.exists():
              assert hashlib.sha256(versioned.read_bytes()).hexdigest()==trigger["sha256"].lower(), "Versioned APK path changed"
          versioned.write_bytes(apk)
          Path("/tmp/hmc-versioned-name.txt").write_text(filename)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          filename="$(cat /tmp/hmc-versioned-name.txt)"
          git add "hmc-truck/$filename"
          if ! git diff --cached --quiet; then
            git commit -m "stage(hmc): immutable verified trial APK before manifest"
            git push origin HEAD:main
          fi

      - name: Verify actual public HTTPS versioned APK bytes before manifest switch
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.trigger.outputs.sha }}
        run: |
          set -euo pipefail
          filename="$(cat /tmp/hmc-versioned-name.txt)"
          url="https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/hmc-truck/$filename"
          verified=false
          for attempt in 1 2 3 4 5 6; do
            if curl --silent --show-error --fail --location --proto "=https" --proto-redir "=https" --connect-timeout 15 --max-time 120 "$url" -o /tmp/hmc-public.apk; then
              if printf '%s  %s\n' "$EXPECTED_SHA" /tmp/hmc-public.apk | sha256sum --check --status && cmp -s /tmp/hmc-public.apk /tmp/hmc-verified.apk; then
                verified=true
                break
              fi
            fi
            sleep 10
          done
          test "$verified" = true
          echo "Public HTTPS APK download and exact SHA-256/byte equality verified"

      - name: Switch verified update manifest without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          trigger=json.loads(Path("/tmp/hmc-publish-trigger.json").read_text())
          assert json.loads(Path("hmc-truck/PUBLISH_TRIGGER.json").read_text())==trigger, "Publish trigger changed concurrently"
          path=Path("hmc-truck/manifest.json")
          manifest=json.loads(path.read_text())
          assert manifest["versionCode"]==trigger["previousVersionCode"], "Published version changed concurrently"
          assert manifest["sha256"].lower()==trigger["previousSha256"].lower(), "Published APK changed concurrently"
          filename=Path("/tmp/hmc-versioned-name.txt").read_text()
          apk=Path("/tmp/hmc-verified.apk").read_bytes()
          assert hashlib.sha256(apk).hexdigest()==trigger["sha256"].lower()
          assert Path("/tmp/hmc-public.apk").read_bytes()==apk, "Public download evidence mismatch"
          assert (Path("hmc-truck")/filename).read_bytes()==apk, "Staged APK changed concurrently"
          Path("hmc-truck/HMC_Truck_Sequence_Feeding_latest.apk").write_bytes(apk)
          manifest={"versionName":trigger["versionName"],"versionCode":trigger["versionCode"],
                    "apkUrl":"https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/hmc-truck/"+filename,
                    "sha256":trigger["sha256"].lower(),
                    "sourceCommit":trigger["sourceCommit"],
                    "signerCertificateSha256":trigger["expectedSignerCertificateSha256"].lower(),
                    "notes":trigger.get("notes","code"+str(trigger["versionCode"])+" smartphone FIELD TEST update; device validation pending.")}
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          Path("hmc-truck/PUBLISH_TRIGGER.json").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hmc-truck/HMC_Truck_Sequence_Feeding_latest.apk hmc-truck/manifest.json hmc-truck/PUBLISH_TRIGGER.json
          git commit -m "publish(hmc): public HTTPS verified code${{ steps.trigger.outputs.version_code }} smartphone in-app update"
          git push origin HEAD:main

      - name: Remove temporary release transfers
        if: ${{ always() }}
        shell: bash
        run: rm -f /tmp/hmc-artifact.zip /tmp/hmc-verified.apk /tmp/hmc-publish-trigger.json /tmp/hmc-public.apk /tmp/hmc-versioned-name.txt

