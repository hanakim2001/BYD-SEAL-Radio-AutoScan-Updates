name: Publish verified BYD code225 via existing in-app UPDATE
on:
  push:
    branches: [main]
    paths: ['.github/publish-v0202-code225-request.json']
permissions:
  contents: write
concurrency:
  group: byd-code225-publish-one
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Download and independently verify candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/publish-v0202-code225-request.json'
          test ! -e BYD_SEAL_AUDIO_V02.02_CODE225.apk
          mkdir -p /tmp/byd225
          python3 - <<'PY'
          import json, pathlib
          req=json.loads(pathlib.Path('.github/publish-v0202-code225-request.json').read_text())
          current=json.loads(pathlib.Path('manifest.json').read_text())
          assert current['versionCode']==224, 'Do not overwrite unexpected version'
          assert req['source_run']==45486914506
          assert req['artifact_id']==14965410078
          assert req['source_sha']=='75a752f278895934ddf62b6c263802c51e7725aa'
          assert req['apk_name']=='BYD_AUDIO_02.02.225.R10.apk'
          assert req['zip_sha256']=='01489a5698e72622d5530a0d709bc7fa2ece6275514830507d5e6e066f5978d2'
          assert req['apk_sha256']=='bb93361dd7337488c8cf39c2a0ee9fda6b87e8cfe43e5e6200158b595c997b7c'
          assert req['archive_url'].startswith('https://sdmnt'), 'Expected ephemeral artifact URL'
          pathlib.Path('/tmp/byd225/url').write_text(req['archive_url'])
          PY
          curl --fail --location --retry 1 --silent --show-error --max-time 120 "$(cat /tmp/byd225/url)" -o /tmp/byd225/archive.zip
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/byd225/archive.zip')
          x=json.loads(pathlib.Path('.github/publish-v0202-code225-request.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==x['zip_sha256'],'ZIP mismatch'
          PY
          unzip -tq /tmp/byd225/archive.zip
          unzip -q /tmp/byd225/archive.zip -d /tmp/byd225
          python3 - <<'PY'
          import hashlib,json,pathlib
          req=json.loads(pathlib.Path('.github/publish-v0202-code225-request.json').read_text())
          p=pathlib.Path('/tmp/byd225')/req['apk_name']
          assert p.stat().st_size==3397923, 'APK size mismatch'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==req['apk_sha256'],'APK mismatch'
          assert pathlib.Path('/tmp/byd225/SHA256SUMS.txt').read_text().split()[0]==req['apk_sha256']
          assert 'DEVICE_PENDING' in pathlib.Path('/tmp/byd225/STATUS.txt').read_text()
          assert pathlib.Path('/tmp/byd225/source_SHA.txt').read_text().strip()==req['source_sha']
          PY
          APK=/tmp/byd225/BYD_AUDIO_02.02.225.R10.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" > /tmp/byd225/package.txt
          grep -q "name='com.seunghyun.bydradioautoscan'" /tmp/byd225/package.txt
          grep -q "versionCode='225'" /tmp/byd225/package.txt
          grep -q "versionName='02.02'" /tmp/byd225/package.txt
          grep -q "launchable-activity: name='com.seunghyun.bydradioautoscan.V0201ProductHomeActivity'" /tmp/byd225/package.txt
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/byd225/signing.txt
          grep -qi 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/byd225/signing.txt
          grep -qi 'cf00d495e6a69f32e8908ca294584a480a4404db80cedfe43ba7df5cb7a695b7' /tmp/byd225/signing.txt
          grep -Fx 'Number of signers: 1' /tmp/byd225/signing.txt
      - name: Publish the verified APK FIRST (not the manifest)
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/byd225/BYD_AUDIO_02.02.225.R10.apk BYD_SEAL_AUDIO_V02.02_CODE225.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BYD_SEAL_AUDIO_V02.02_CODE225.apk
          git diff --cached --check
          git commit -m 'Publish signed code225 trial APK before UPDATE manifest [skip ci]'
          git push origin HEAD:main
      - name: Verify published HTTPS APK byte-for-byte BEFORE manifest
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE225.apk'
          ok=0
          for n in 1 2 3 4 5 6 7 8; do
            if curl -fLsS --max-time 30 "$URL" -o /tmp/byd225/online.apk; then
              if python3 - <<'PY'
          import hashlib,json
          p='/tmp/byd225/online.apk'
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          x=json.load(open('.github/publish-v0202-code225-request.json'))
          assert h==x['apk_sha256'],'Remote APK SHA mismatch'
          PY
              then ok=1;break;fi
            fi
            sleep 2
          done
          test "$ok" = 1
      - name: Update manifest LAST, after verified remote APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('manifest.json')
          d=json.loads(p.read_text())
          x=json.loads(pathlib.Path('.github/publish-v0202-code225-request.json').read_text())
          assert d['versionCode']==224
          d.update({'versionCode':225,'versionName':'02.02','apkUrl':'https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE225.apk','sha256':x['apk_sha256'],'releaseNotes':'R10 code225 실차 시험판: 앱 밝기 40~100% 및 자동 복원, 터치 조절선 굵기, WEB 빈 화면 감지·복구, 순정 라디오 수신 상태 정합성 및 R9 누적 개선. 주차 상태에서 시험. 기존 앱 삭제 금지. 차량 정보·OEM 자동검색·6리스너·HUD/TURN/계기판 및 실제 음향 미확인.'})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add manifest.json
          git diff --cached --check
          git commit -m 'Enable verified code225 in existing in-app UPDATE channel [skip ci]'
          git push origin HEAD:main
      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --max-time 40 'https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/manifest.json' -o /tmp/byd225/manifest.json
          python3 - <<'PY'
          import json
          x=json.load(open('.github/publish-v0202-code225-request.json'))
          d=json.load(open('/tmp/byd225/manifest.json'))
          assert d['versionCode']==225
          assert d['sha256']==x['apk_sha256']
          assert d['versionName']=='02.02'
          assert d['apkUrl']=='https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE225.apk'
          print('CODE225 IN-APP UPDATE: APK+MANIFEST VERIFIED')
          PY
