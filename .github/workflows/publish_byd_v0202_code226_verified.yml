name: Publish verified BYD code226 via existing in-app UPDATE
on:
  push:
    branches: [main]
    paths: ['.github/publish-v0202-code226-request.json']
permissions:
  contents: write
concurrency:
  group: byd-code226-publish-one
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Download and independently verify candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/publish-v0202-code226-request.json'
          test ! -e BYD_SEAL_AUDIO_V02.02_CODE226.apk
          mkdir -p /tmp/byd226
          python3 - <<'PY'
          import json, pathlib
          req=json.loads(pathlib.Path('.github/publish-v0202-code226-request.json').read_text())
          current=json.loads(pathlib.Path('manifest.json').read_text())
          assert current['versionCode']==225, 'Do not overwrite unexpected version'
          assert req['source_run']==45753870614
          assert req['artifact_id']==15086368393
          assert req['source_sha']=='f09a016628ffedd0c6f2237d52e6afd4b006e44b'
          assert req['apk_name']=='BYD_AUDIO_02.02.226.R11.apk'
          assert req['zip_sha256']=='e12e7a25c659eff19be295a789390b8436b35a2ebd9e16ba3a44e41b4ba198ba'
          assert req['apk_sha256']=='0816e4cf592ca0f5c739b0143f25e8721436492160b6829152304228d2200281'
          assert req['archive_url'].startswith('https://sdmnt'), 'Expected ephemeral artifact URL'
          pathlib.Path('/tmp/byd226/url').write_text(req['archive_url'])
          PY
          curl --fail --location --retry 1 --silent --show-error --max-time 120 "$(cat /tmp/byd226/url)" -o /tmp/byd226/archive.zip
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/byd226/archive.zip')
          x=json.loads(pathlib.Path('.github/publish-v0202-code226-request.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==x['zip_sha256'],'ZIP mismatch'
          PY
          unzip -tq /tmp/byd226/archive.zip
          unzip -q /tmp/byd226/archive.zip -d /tmp/byd226
          python3 - <<'PY'
          import hashlib,json,pathlib
          req=json.loads(pathlib.Path('.github/publish-v0202-code226-request.json').read_text())
          p=pathlib.Path('/tmp/byd226')/req['apk_name']
          assert p.stat().st_size==3414347, 'APK size mismatch'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==req['apk_sha256'],'APK mismatch'
          assert pathlib.Path('/tmp/byd226/SHA256SUMS.txt').read_text().split()[0]==req['apk_sha256']
          assert 'DEVICE_PENDING' in pathlib.Path('/tmp/byd226/STATUS.txt').read_text()
          assert pathlib.Path('/tmp/byd226/source_SHA.txt').read_text().strip()==req['source_sha']
          PY
          APK=/tmp/byd226/BYD_AUDIO_02.02.226.R11.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" > /tmp/byd226/package.txt
          grep -q "name='com.seunghyun.bydradioautoscan'" /tmp/byd226/package.txt
          grep -q "versionCode='226'" /tmp/byd226/package.txt
          grep -q "versionName='02.02'" /tmp/byd226/package.txt
          grep -q "launchable-activity: name='com.seunghyun.bydradioautoscan.V0201ProductHomeActivity'" /tmp/byd226/package.txt
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/byd226/signing.txt
          grep -qi 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/byd226/signing.txt
          grep -qi 'cf00d495e6a69f32e8908ca294584a480a4404db80cedfe43ba7df5cb7a695b7' /tmp/byd226/signing.txt
          grep -Fx 'Number of signers: 1' /tmp/byd226/signing.txt
      - name: Publish the verified APK FIRST (not the manifest)
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/byd226/BYD_AUDIO_02.02.226.R11.apk BYD_SEAL_AUDIO_V02.02_CODE226.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BYD_SEAL_AUDIO_V02.02_CODE226.apk
          git diff --cached --check
          git commit -m 'Publish signed code226 trial APK before UPDATE manifest [skip ci]'
          git push origin HEAD:main
      - name: Verify published HTTPS APK byte-for-byte BEFORE manifest
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE226.apk'
          ok=0
          for n in 1 2 3 4 5 6 7 8; do
            if curl -fLsS --max-time 30 "$URL" -o /tmp/byd226/online.apk; then
              if python3 - <<'PY'
          import hashlib,json
          p='/tmp/byd226/online.apk'
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          x=json.load(open('.github/publish-v0202-code226-request.json'))
          assert h==x['apk_sha256'],'Remote APK SHA mismatch'
          PY
              then ok=1;break;fi
            fi
            sleep 2
          done
          test "$ok" = 1
      - name: Update manifest LAST, after verified remote APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('manifest.json')
          d=json.loads(p.read_text())
          x=json.loads(pathlib.Path('.github/publish-v0202-code226-request.json').read_text())
          assert d['versionCode']==225
          d.update({'versionCode':226,'versionName':'02.02','apkUrl':'https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE226.apk','sha256':x['apk_sha256'],'releaseNotes':'R11 code226 실차 시험판: SYSTEM 손가락 스크롤·밝기, MUSIC 한글 동작, iRADIO 목록·미리듣기·재생 소유권, WEB 로딩 복구, FM/BT 선택 및 HUD 재연결 개선. 주차 상태에서 시험. 기존 앱 삭제 금지. HUD/TURN·차량정보·실제 음량 및 순정 재생 미확인.'})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add manifest.json
          git diff --cached --check
          git commit -m 'Enable verified code226 in existing in-app UPDATE channel [skip ci]'
          git push origin HEAD:main
      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --max-time 40 'https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/manifest.json' -o /tmp/byd226/manifest.json
          python3 - <<'PY'
          import json
          x=json.load(open('.github/publish-v0202-code226-request.json'))
          d=json.load(open('/tmp/byd226/manifest.json'))
          assert d['versionCode']==226
          assert d['sha256']==x['apk_sha256']
          assert d['versionName']=='02.02'
          assert d['apkUrl']=='https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE226.apk'
          print('CODE226 IN-APP UPDATE: APK+MANIFEST VERIFIED')
          PY
