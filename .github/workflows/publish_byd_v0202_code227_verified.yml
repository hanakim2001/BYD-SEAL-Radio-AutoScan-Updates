name: Publish verified BYD code227 via existing in-app UPDATE
on:
  push:
    branches: [main]
    paths: ['.github/publish-v0202-code227-request.json']
permissions:
  contents: write
concurrency:
  group: byd-code227-publish-one
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Download and independently verify candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/publish-v0202-code227-request.json'
          test ! -e BYD_SEAL_AUDIO_V02.02_CODE227.apk
          mkdir -p /tmp/byd227
          python3 - <<'PY'
          import json, pathlib
          req=json.loads(pathlib.Path('.github/publish-v0202-code227-request.json').read_text())
          current=json.loads(pathlib.Path('manifest.json').read_text())
          assert current['versionCode']==226, 'Do not overwrite unexpected version'
          assert req['source_run']==46146661084
          assert req['artifact_id']==15263901830
          assert req['source_sha']=='074e2748f394e6510579cc7e641f77344de1d5fd'
          assert req['apk_name']=='BYD_AUDIO_02.02.227.R12.apk'
          assert req['zip_sha256']=='fe55e42ab4a51c18d6ffdf145db363c441574ead0fece5b4197acc975e9f0bc8'
          assert req['apk_sha256']=='e97a3b6d7eb9b28538752df9fa51589bb5c1a4657a92c54f59e85ea1866c833e'
          assert req['archive_url'].startswith('https://sdmnt'), 'Expected ephemeral artifact URL'
          pathlib.Path('/tmp/byd227/url').write_text(req['archive_url'])
          PY
          curl --fail --location --retry 1 --silent --show-error --max-time 120 "$(cat /tmp/byd227/url)" -o /tmp/byd227/archive.zip
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/byd227/archive.zip')
          x=json.loads(pathlib.Path('.github/publish-v0202-code227-request.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==x['zip_sha256'],'ZIP mismatch'
          PY
          unzip -tq /tmp/byd227/archive.zip
          unzip -q /tmp/byd227/archive.zip -d /tmp/byd227
          python3 - <<'PY'
          import hashlib,json,pathlib
          req=json.loads(pathlib.Path('.github/publish-v0202-code227-request.json').read_text())
          p=pathlib.Path('/tmp/byd227')/req['apk_name']
          assert p.stat().st_size==3420878, 'APK size mismatch'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==req['apk_sha256'],'APK mismatch'
          assert pathlib.Path('/tmp/byd227/SHA256SUMS.txt').read_text().split()[0]==req['apk_sha256']
          assert 'DEVICE_PENDING' in pathlib.Path('/tmp/byd227/STATUS.txt').read_text()
          assert pathlib.Path('/tmp/byd227/source_SHA.txt').read_text().strip()==req['source_sha']
          PY
          APK=/tmp/byd227/BYD_AUDIO_02.02.227.R12.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" > /tmp/byd227/package.txt
          grep -q "name='com.seunghyun.bydradioautoscan'" /tmp/byd227/package.txt
          grep -q "versionCode='227'" /tmp/byd227/package.txt
          grep -q "versionName='02.02'" /tmp/byd227/package.txt
          grep -q "launchable-activity: name='com.seunghyun.bydradioautoscan.V0201ProductHomeActivity'" /tmp/byd227/package.txt
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/byd227/signing.txt
          grep -qi 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/byd227/signing.txt
          grep -qi 'cf00d495e6a69f32e8908ca294584a480a4404db80cedfe43ba7df5cb7a695b7' /tmp/byd227/signing.txt
          grep -Fx 'Number of signers: 1' /tmp/byd227/signing.txt
      - name: Publish the verified APK FIRST (not the manifest)
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/byd227/BYD_AUDIO_02.02.227.R12.apk BYD_SEAL_AUDIO_V02.02_CODE227.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BYD_SEAL_AUDIO_V02.02_CODE227.apk
          git diff --cached --check
          git commit -m 'Publish signed code227 trial APK before UPDATE manifest [skip ci]'
          git push origin HEAD:main
      - name: Verify published HTTPS APK byte-for-byte BEFORE manifest
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE227.apk'
          ok=0
          for n in 1 2 3 4 5 6 7 8; do
            if curl -fLsS --max-time 30 "$URL" -o /tmp/byd227/online.apk; then
              if python3 - <<'PY'
          import hashlib,json
          p='/tmp/byd227/online.apk'
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          x=json.load(open('.github/publish-v0202-code227-request.json'))
          assert h==x['apk_sha256'],'Remote APK SHA mismatch'
          PY
              then ok=1;break;fi
            fi
            sleep 2
          done
          test "$ok" = 1
      - name: Update manifest LAST, after verified remote APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('manifest.json')
          d=json.loads(p.read_text())
          x=json.loads(pathlib.Path('.github/publish-v0202-code227-request.json').read_text())
          assert d['versionCode']==226
          d.update({'versionCode':227,'versionName':'02.02','apkUrl':'https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE227.apk','sha256':x['apk_sha256'],'releaseNotes':'R12 code227 실차 시험판: TPMS 무효값 및 주행가능거리 조회 개선, WEB 시간초과·복구, iRADIO 미리듣기 소유권·출력 진단, HUD/TURN 응답 연동 개선. 주차 상태에서 시험. 기존 앱 삭제 금지. HUD/TURN·차량정보·실제 음량 및 순정 재생 미확인.'})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add manifest.json
          git diff --cached --check
          git commit -m 'Enable verified code227 in existing in-app UPDATE channel [skip ci]'
          git push origin HEAD:main
      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --max-time 40 'https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/manifest.json' -o /tmp/byd227/manifest.json
          python3 - <<'PY'
          import json
          x=json.load(open('.github/publish-v0202-code227-request.json'))
          d=json.load(open('/tmp/byd227/manifest.json'))
          assert d['versionCode']==227
          assert d['sha256']==x['apk_sha256']
          assert d['versionName']=='02.02'
          assert d['apkUrl']=='https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE227.apk'
          print('CODE227 IN-APP UPDATE: APK+MANIFEST VERIFIED')
          PY
