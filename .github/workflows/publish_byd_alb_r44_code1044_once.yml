name: Stage signed BYD ALB R44 for existing in-app update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish_byd_alb_r44_code1044_once.yml'
permissions:
  contents: write
concurrency:
  group: byd-alb-qa-binary
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_PATH: byd-alb/BYD_ALB_01.01_02_R44.apk
      APK_SHA: d890a900a06cf7f4c1e0fa72820f2618742bdc88de893e8bb8a60cd10c6ac3d7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check the R43 baseline and reconstruct the approved R44 APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/publish_byd_alb_r44_code1044_once.yml'
          test "$(git hash-object byd-alb/manifest.json)" = 61088004e523a86406b3aec8e44347b0e5da6192
          test ! -e "$APK_PATH"
          parts=(
            76323c7affcfcf94b71d85bbb51f84dd64bb32f0
            0e5842c75e268e329e0b322c9d6f2816c634a33a
            0c5639059b70dd8da89fe520a1bac462531a9f90
            8c99abd204adeffd4f6e67509ffd227db9307356
            77c96d353e2e44b0aaca4b77fd59b26404130839
            2ce856b0b4ef18dc44b1822bbcedec6e5a6dbbb4
            e0c0107df0f364686c5b1cd63cd9e1900b959ced
            b322312c2598dccd419f0fbe300ae2d94dd77706
            59a8f155e9cf6902a30432de5ac0ff824b4a9cb4
            7b636978dca966846c1b495036a2253030d53892
            01709e946f6689426ba2bcf699ecfca9cd999e31
            b36004a2476c3ef6648c52d75028988caa74b3f5
          )
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          for sha in "${parts[@]}"; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/git/blobs/$sha" > "$work/part"
            test "$(git hash-object "$work/part")" = "$sha"
            cat "$work/part" >> "$work/apk.gz"
          done
          echo "1263b1713fc28945c6407ebc22a6f569177b59a5f90a2774129d51a0a185cf71  $work/apk.gz" | sha256sum -c -
          gzip -dc "$work/apk.gz" > "$work/verified.apk"
          test "$(stat -c %s "$work/verified.apk")" = 18974448
          echo "$APK_SHA  $work/verified.apk" | sha256sum -c -
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$aapt" dump badging "$work/verified.apk" > "$work/badging"
          grep -Fq "package: name='com.seunghyun.bydautolock.test' versionCode='1044' versionName='01.01_02_R44'" "$work/badging"
          "$apksigner" verify --verbose --print-certs "$work/verified.apk" > "$work/signer"
          cat "$work/signer"
          grep -Fiq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$work/signer"
          grep -Fiq '65637d09d45b6b05096c7831d92f65a039c6e3b06fdef6632601d7766ea05403' "$work/signer"
          cp "$work/verified.apk" "$APK_PATH"
      - name: Publish only the verified R44 binary
        shell: bash
        run: |
          set -euo pipefail
          echo "$APK_SHA  $APK_PATH" | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$APK_PATH"
          test "$(git diff --cached --name-only)" = "$APK_PATH"
          git diff --cached --check
          git commit -m 'Publish verified BYD ALB R44 QA APK binary [skip ci]'
          git push origin HEAD:main
