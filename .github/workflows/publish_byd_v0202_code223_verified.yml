name: Publish verified BYD code223 via existing in-app UPDATE
on:
  push:
    branches: [main]
    paths: ['.github/publish-v0202-code223-request.json']
permissions:
  contents: write
concurrency:
  group: byd-code223-publish-one
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Download and independently verify candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/publish-v0202-code223-request.json'
          test ! -e BYD_SEAL_AUDIO_V02.02_CODE223.apk
          mkdir -p /tmp/byd223
          python3 - <<'PY'
          import json, pathlib
          req=json.loads(pathlib.Path('.github/publish-v0202-code223-request.json').read_text())
          current=json.loads(pathlib.Path('manifest.json').read_text())
          assert current['versionCode']==221, 'Do not overwrite unexpected version'
          assert req['source_run']==45315410930
          assert req['source_sha']=='734a4115e58f8b7e9c4bf555676e73da203255ef'
          assert req['apk_name']=='BYD_AUDIO_02.02.223.R8.apk'
          assert req['zip_sha256']=='0c4f138b3bcb8116e243c67459683dae5119a45471522a3a31c87eca4463659d'
          assert req['apk_sha256']=='a6ee785fc3fba965b359394202d7c971d41a1b59d48c4ccb30033f04e870ecda'
          assert req['archive_url'].startswith('https://sdmnt'), 'Expected ephemeral artifact URL'
          pathlib.Path('/tmp/byd223/url').write_text(req['archive_url'])
          PY
          curl --fail --location --retry 1 --silent --show-error --max-time 120 "$(cat /tmp/byd223/url)" -o /tmp/byd223/archive.zip
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('/tmp/byd223/archive.zip')
          x=json.loads(pathlib.Path('.github/publish-v0202-code223-request.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==x['zip_sha256'],'ZIP mismatch'
          PY
          unzip -tq /tmp/byd223/archive.zip
          unzip -q /tmp/byd223/archive.zip -d /tmp/byd223
          python3 - <<'PY'
          import hashlib,json,pathlib
          req=json.loads(pathlib.Path('.github/publish-v0202-code223-request.json').read_text())
          p=pathlib.Path('/tmp/byd223')/req['apk_name']
          assert hashlib.sha256(p.read_bytes()).hexdigest()==req['apk_sha256'],'APK mismatch'
          assert pathlib.Path('/tmp/byd223/source_SHA.txt').read_text().strip()==req['source_sha']
          PY
          APK=/tmp/byd223/BYD_AUDIO_02.02.223.R8.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" > /tmp/byd223/package.txt
          grep -q "name='com.seunghyun.bydradioautoscan'" /tmp/byd223/package.txt
          grep -q "versionCode='223'" /tmp/byd223/package.txt
          grep -q "versionName='02.02'" /tmp/byd223/package.txt
          grep -q "launchable-activity: name='com.seunghyun.bydradioautoscan.V0201ProductHomeActivity'" /tmp/byd223/package.txt
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/byd223/signing.txt
          grep -qi 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/byd223/signing.txt
          grep -qi 'cf00d495e6a69f32e8908ca294584a480a4404db80cedfe43ba7df5cb7a695b7' /tmp/byd223/signing.txt
          grep -Fx 'Number of signers: 1' /tmp/byd223/signing.txt
      - name: Publish the verified APK FIRST (not the manifest)
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/byd223/BYD_AUDIO_02.02.223.R8.apk BYD_SEAL_AUDIO_V02.02_CODE223.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BYD_SEAL_AUDIO_V02.02_CODE223.apk
          git diff --cached --check
          git commit -m 'Publish signed code223 trial APK before UPDATE manifest [skip ci]'
          git push origin HEAD:main
      - name: Verify published HTTPS APK byte-for-byte BEFORE manifest
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE223.apk'
          ok=0
          for n in 1 2 3 4 5 6 7 8; do
            if curl -fLsS --max-time 30 "$URL" -o /tmp/byd223/online.apk; then
              if python3 - <<'PY'
          import hashlib,json
          p='/tmp/byd223/online.apk'
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          x=json.load(open('.github/publish-v0202-code223-request.json'))
          assert h==x['apk_sha256'],'Remote APK SHA mismatch'
          PY
              then ok=1;break;fi
            fi
            sleep 2
          done
          test "$ok" = 1
      - name: Update manifest LAST, after verified remote APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('manifest.json')
          d=json.loads(p.read_text())
          x=json.loads(pathlib.Path('.github/publish-v0202-code223-request.json').read_text())
          assert d['versionCode']==221
          d.update({'versionCode':223,'versionName':'02.02','apkUrl':'https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/BYD_SEAL_AUDIO_V02.02_CODE223.apk','sha256':x['apk_sha256'],'releaseNotes':'R8 code223 실차 시험판: HOME 및 VEHICLE 실제 SOC·속도·주행가능거리 직접 읽기 표시, MUSIC 곡명·목록, iRADIO 9슬롯·3페이지 스와이프·전체목록 이동, 순정 FM/BT 복귀, WEB/OTT/SYSTEM 개선. 주차 상태에서 시험. OEM 6리스너·자동검색·HUD/TURN/계기판은 미확인. 기존 앱 삭제 금지. 설정 > UPDATE > CHECK.'})
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add manifest.json
          git diff --cached --check
          git commit -m 'Enable verified code223 in existing in-app UPDATE channel [skip ci]'
          git push origin HEAD:main
      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --max-time 40 'https://raw.githubusercontent.com/hanakim2001/BYD-SEAL-Radio-AutoScan-Updates/main/manifest.json' -o /tmp/byd223/manifest.json
          python3 - <<'PY'
          import json
          x=json.load(open('.github/publish-v0202-code223-request.json'))
          d=json.load(open('/tmp/byd223/manifest.json'))
          assert d['versionCode']==223
          assert d['sha256']==x['apk_sha256']
          print('CODE223 IN-APP UPDATE: APK+MANIFEST VERIFIED')
          PY
